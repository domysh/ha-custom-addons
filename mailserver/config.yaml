name: "Mail Server"
version: "1.1.0"
slug: "mailserver"
description: "docker-mailserver SMTP relay, TLS via shared Let's Encrypt certificate"
url: "https://github.com/docker-mailserver/docker-mailserver"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ports:
  587/tcp: 587
  465/tcp: 465
ports_description:
  587/tcp: SMTP submission (STARTTLS)
  465/tcp: SMTP submission (implicit TLS)
map:
  - share:rw
environment:
  ENABLE_POP3: "0"
  ENABLE_IMAP: "0"
  OVERRIDE_HOSTNAME: "mail.domy.sh"
  ENABLE_SPAMASSASSIN: "0"
  ENABLE_CLAMAV: "0"
  ENABLE_FAIL2BAN: "1"
  TLS_LEVEL: "modern"
  PERMIT_DOCKER: "network"
  ENABLE_AMAVIS: "0"
  SSL_TYPE: "manual"
  SSL_CERT_PATH: "/share/certs/live/mail.domy.sh/fullchain.pem"
  SSL_KEY_PATH: "/share/certs/live/mail.domy.sh/privkey.pem"
